name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate application icons
        run: node scripts/generate-icon.mjs
      - name: Test routing script
        run: npm test
      - name: Test Windows application association
        shell: powershell
        run: .\tests\scanner.test.ps1
      - name: Build frontend and check TypeScript
        run: npm run build
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Package desktop app
        run: npm run desktop:build
      - name: Upload Windows installer and portable executable
        uses: actions/upload-artifact@v5
        with:
          name: clash-app-bypass-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/clash-app-bypass.exe
          if-no-files-found: error
      - name: Upload dependency lock files
        uses: actions/upload-artifact@v5
        with:
          name: dependency-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
