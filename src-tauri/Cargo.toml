[package]
name = "clash-app-bypass"
version = "0.1.0"
description = "Windows application direct routing assistant for Clash Verge Rev"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
fs2 = "0.4"
base64 = "0.22"

